name: fn_giwu
description: Giwu Bible — multi-version reader (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.0
  sherpa_onnx: ^1.13.4
  audioplayers: ^6.8.1
  archive: ^4.0.9
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  adaptive_icon_background: "#1a1a1a"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
